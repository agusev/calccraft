name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    # The app targets Windows (DWM title bar tint, Segoe fonts), so CI runs there too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Stable must be at least 1.95, the crate's rust-version.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
