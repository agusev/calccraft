[package]
name = "calculator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A clone of the Windows 11 Calculator (Standard and Date calculation modes) built with egui"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.36.2"
num-bigint = "0.4"
num-rational = "0.4.2"
num-traits = "0.2.19"

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
